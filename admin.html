
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>MONKEY - لوحة المدير</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
header{text-align:center;background:#202020;padding:20px;border-bottom:2px solid #ff8500}
header h2{color:#ff8500;margin:0}
main{max-width:600px;margin:auto;padding:16px}
.panel{background:#202020;padding:18px;border-radius:12px;margin-bottom:18px}
h3{color:#ffae42}
input,textarea,select{
width:100%;padding:13px;margin:7px 0 13px;
background:#111;color:white;border:1px solid #555;
border-radius:8px;font-size:15px
}
button{
width:100%;padding:14px;background:#ff8500;color:#111;
border:0;border-radius:9px;font-size:16px;font-weight:bold;
margin-top:8px;cursor:pointer
}
.secondary{background:#444;color:white}
.danger{background:#a92828;color:white}
.small{width:auto;padding:9px 13px;font-size:13px;margin:4px}
.hidden{display:none}
.message{color:#ffae42;line-height:1.8;white-space:pre-wrap}
.product-item{padding:13px 0;border-bottom:1px solid #555;line-height:1.8}
.product-images{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.product-images img{width:75px;height:75px;object-fit:cover;border-radius:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{flex:1;min-width:90px}
</style>
</head>
<body>

<header>
<h2>🐵 MONKEY</h2>
<p>لوحة إدارة المتجر</p>
</header>

<main>

<div class="panel" id="loginPanel">
<h3>تسجيل دخول المدير</h3>
<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">تسجيل الدخول</button>
<div id="loginMessage" class="message"></div>
</div>

<div id="adminPanel" class="hidden">

<div class="panel">
<h3>إعدادات الأسعار</h3>
<label>سعر صرف الريال السعودي بالجنيه السوداني</label>
<input id="exchangeRate" type="number" min="0">
<label>هامش الربح بالنسبة المئوية</label>
<input id="profitPercent" type="number" min="0">
<button id="saveSettings">حفظ الإعدادات</button>
</div>

<div class="panel">
<h3 id="formTitle">إضافة قطعة غيار</h3>

<label>اسم القطعة</label>
<input id="name" placeholder="اسم القطعة">

<label>الوصف</label>
<textarea id="description" placeholder="تفاصيل القطعة"></textarea>

<label>حالة القطعة</label>
<select id="condition">
<option value="new">جديدة</option>
<option value="used">مستعملة</option>
</select>

<label>التكلفة بالريال السعودي</label>
<input id="cost" type="number" min="0">

<label>السعر اليدوي بالجنيه السوداني (اختياري)</label>
<input id="manualPrice" type="number" min="0">

<label>صور القطعة</label>
<input id="images" type="file" accept="image/*" multiple>
<div class="message">عند التعديل، اختيار صور جديدة يستبدل الصور القديمة.</div>

<label>
<input id="available" type="checkbox" checked style="width:auto">
متوفر للبيع
</label>

<button id="addProduct">إضافة المنتج</button>
<button id="cancelEdit" class="secondary hidden">إلغاء التعديل</button>
<div id="productMessage" class="message"></div>
</div>

<div class="panel">
<h3>المنتجات المسجلة</h3>
<div id="productList">جارٍ تحميل المنتجات...</div>
</div>

<button class="secondary" id="logoutBtn">تسجيل الخروج</button>
</div>

<div id="generalMessage" class="message"></div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const URL = 'https://imuasdnaomubnlxcjvci.supabase.co';
const KEY = 'sb_publishable_nvxMo7OEi917ycwbfBcf9w_I3NBsNDa';
const db = createClient(URL, KEY);

const $ = id => document.getElementById(id);
const msg = (id, text) => { $(id).textContent = text; };

let editingId = null;

async function isAdmin() {
  const { data: { user }, error: userError } = await db.auth.getUser();
  if (userError || !user) return false;

  const { data, error } = await db.rpc('is_store_admin');

  if (error) {
    msg('loginMessage','خطأ التحقق من صلاحية المدير: '+error.message);
    return false;
  }

  return data === true;
}

async function openPanel() {
  if (!await isAdmin()) {
    msg('loginMessage','هذا الحساب ليس لديه صلاحية المدير.');
    await db.auth.signOut();
    return;
  }

  $('loginPanel').classList.add('hidden');
  $('adminPanel').classList.remove('hidden');
  await loadSettings();
  await loadProducts();
}

$('loginBtn').onclick = async () => {
  msg('loginMessage','جارٍ تسجيل الدخول...');

  const {error} = await db.auth.signInWithPassword({
    email:$('email').value.trim(),
    password:$('password').value
  });

  if(error) {
    msg('loginMessage','خطأ: '+error.message);
    return;
  }

  await openPanel();
};

async function loadSettings() {
  const {data,error} = await db.from('app_settings')
    .select('*').eq('id',1).single();

  if(error) {
    msg('generalMessage','خطأ الإعدادات: '+error.message);
    return;
  }

  $('exchangeRate').value = data.exchange_rate ?? '';
  $('profitPercent').value = data.profit_percent ?? '';
}

$('saveSettings').onclick = async () => {
  const rate = Number($('exchangeRate').value);
  const profit = Number($('profitPercent').value);

  if(rate <= 0 || profit < 0) {
    msg('generalMessage','أدخل سعر صرف صحيحاً وهامش ربح صحيحاً.');
    return;
  }

  const {error} = await db.from('app_settings').update({
    exchange_rate:rate,
    profit_percent:profit
  }).eq('id',1);

  msg('generalMessage',error ? error.message : 'تم حفظ الإعدادات بنجاح.');
};

async function uploadImages(files) {
  const urls = [];

  for(const file of files) {
    if(!file.type.startsWith('image/')) {
      throw new Error('الملف المختار ليس صورة.');
    }

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path = Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+safeName;

    const {error} = await db.storage
      .from('product-images').upload(path,file);

    if(error) throw error;

    const {data} = db.storage.from('product-images').getPublicUrl(path);
    urls.push(data.publicUrl);
  }

  return urls;
}

function resetForm() {
  editingId = null;
  $('formTitle').textContent = 'إضافة قطعة غيار';
  $('addProduct').textContent = 'إضافة المنتج';
  $('cancelEdit').classList.add('hidden');

  $('name').value = '';
  $('description').value = '';
  $('condition').value = 'new';
  $('cost').value = '';
  $('manualPrice').value = '';
  $('images').value = '';
  $('available').checked = true;
}

$('cancelEdit').onclick = () => {
  resetForm();
  msg('productMessage','تم إلغاء التعديل.');
};

$('addProduct').onclick = async () => {
  msg('productMessage','جارٍ حفظ المنتج...');

  const name = $('name').value.trim();
  const costText = $('cost').value.trim();
  const cost = Number(costText);
  const manual = $('manualPrice').value.trim();

  if(!name || costText === '' || !Number.isFinite(cost) || cost < 0) {
    msg('productMessage','أدخل اسم القطعة والتكلفة بشكل صحيح.');
    return;
  }

  const rate = Number($('exchangeRate').value);
  const profit = Number($('profitPercent').value);

  if(rate <= 0 || profit < 0) {
    msg('productMessage','احفظ سعر الصرف وهامش الربح أولاً.');
    return;
  }

  const fixed = manual !== '';
  const price = fixed ? Number(manual) :
    Math.round(cost * rate * (1 + profit / 100));

  if(!Number.isFinite(price) || price <= 0) {
    msg('productMessage','السعر غير صحيح.');
    return;
  }

  try {
    const files = Array.from($('images').files);
    let imageUrls = [];

    if(editingId) {
      const {data:oldProduct,error:readError} = await db.from('products')
        .select('image_urls').eq('id',editingId).single();

      if(readError) throw readError;

      imageUrls = oldProduct.image_urls || [];

      if(files.length) {
        imageUrls = await uploadImages(files);
      }
    } else {
      imageUrls = await uploadImages(files);
    }

    const productData = {
      name,
      description:$('description').value.trim(),
      condition:$('condition').value,
      cost_sar:cost,
      exchange_rate:rate,
      profit_percent:profit,
      price_sdg:price,
      fixed_price:fixed,
      image_urls:imageUrls,
      available:$('available').checked
    };

    let error;

    if(editingId) {
      ({error} = await db.from('products')
        .update(productData).eq('id',editingId));
    } else {
      ({error} = await db.from('products').insert(productData));
    }

    if(error) throw error;

    msg('productMessage',editingId ?
      'تم تعديل المنتج بنجاح.' : 'تمت إضافة المنتج بنجاح.');

    resetForm();
    await loadProducts();

  } catch(error) {
    msg('productMessage','حدث خطأ: '+error.message);
  }
};

async function editProduct(id) {
  const {data,error} = await db.from('products')
    .select('*').eq('id',id).single();

  if(error) {
    msg('productMessage','خطأ تحميل المنتج: '+error.message);
    return;
  }

  editingId = id;

  $('formTitle').textContent = 'تعديل قطعة الغيار';
  $('addProduct').textContent = 'حفظ التعديلات';
  $('cancelEdit').classList.remove('hidden');

  $('name').value = data.name || '';
  $('description').value = data.description || '';
  $('condition').value = data.condition || 'new';
  $('cost').value = data.cost_sar ?? '';
  $('manualPrice').value = data.fixed_price ? data.price_sdg : '';
  $('available').checked = data.available;
  $('images').value = '';

  $('productMessage').textContent =
    'يمكنك تعديل البيانات. اترك الصور دون اختيار للاحتفاظ بالصور الحالية.';

  $('formTitle').scrollIntoView({behavior:'smooth'});
}

async function deleteProduct(id) {
  const confirmed = confirm('هل أنت متأكد أنك تريد حذف هذه القطعة؟');
  if(!confirmed) return;

  msg('productMessage','جارٍ حذف المنتج...');

  const {error} = await db.from('products').delete().eq('id',id);

  if(error) {
    msg('productMessage','خطأ الحذف: '+error.message);
    return;
  }

  if(editingId === id) resetForm();

  msg('productMessage','تم حذف المنتج بنجاح.');
  await loadProducts();
}

async function loadProducts() {
  const {data,error} = await db.from('products')
    .select('id,name,description,condition,cost_sar,exchange_rate,profit_percent,price_sdg,fixed_price,image_urls,available')
    .order('created_at',{ascending:false});

  if(error) {
    msg('productList','خطأ تحميل المنتجات: '+error.message);
    return;
  }

  $('productList').replaceChildren();

  if(!data.length) {
    msg('productList','لا توجد منتجات مسجلة.');
    return;
  }

  data.forEach(product => {
    const item = document.createElement('div');
    item.className = 'product-item';

    const name = document.createElement('strong');
    name.textContent = product.name;

    const price = document.createElement('div');
    price.textContent =
      Number(product.price_sdg).toLocaleString('ar')+' جنيه سوداني';

    const condition = document.createElement('div');
    condition.textContent =
      product.condition === 'new' ? 'الحالة: جديدة' : 'الحالة: مستعملة';

    const status = document.createElement('div');
    status.textContent = product.available ? 'متوفر للبيع' : 'غير متوفر';

    item.append(name,price,condition,status);

    if(product.image_urls && product.image_urls.length) {
      const images = document.createElement('div');
      images.className = 'product-images';

      product.image_urls.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.alt = product.name;
        img.loading = 'lazy';
        images.append(img);
      });

      item.append(images);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';

    const editButton = document.createElement('button');
    editButton.className = 'small';
    editButton.textContent = '✏️ تعديل';
    editButton.onclick = () => editProduct(product.id);

    const deleteButton = document.createElement('button');
    deleteButton.className = 'small danger';
    deleteButton.textContent = '🗑️ حذف';
    deleteButton.onclick = () => deleteProduct(product.id);

    actions.append(editButton,deleteButton);
    item.append(actions);

    $('productList').append(item);
  });
}

$('logoutBtn').onclick = async () => {
  await db.auth.signOut();
  $('adminPanel').classList.add('hidden');
  $('loginPanel').classList.remove('hidden');
  resetForm();
  msg('loginMessage','تم تسجيل الخروج.');
};

db.auth.getSession().then(async ({data}) => {
  if(data.session) await openPanel();
});
</script>
</body>
</html>
